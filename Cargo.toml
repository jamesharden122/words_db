[package]
name = "words_db"
version = "0.1.0"
edition = "2021"
readme = "README.md"

[dependencies]
chrono = "0.4.38"
csv = "1.3.0"
futures = "0.3.30"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0"
polars = { version = "0.52.0", features = ["lazy","polars-io", "dtype-full","temporal","timezones", "parquet","rolling_window", "rolling_window_by",  "fmt_no_tty",  "abs",  "cum_agg","rank", "propagate_nans", "cov"]}
polars-arrow = "0.52.0"
surrealdb = { version = "2.0.1", features = ["kv-mem"] }
tokio = { version = "1.40.0", features = ["macros", "rt-multi-thread"] }
rayon = "1.11.0"
itertools = "0.14.0"
duckdb = { version = "1.4.4", features = ["bundled", "chrono"] }
uuid = "1.18.1"
arrow-array = { version = "56.2.0", features = ["ffi"] }

[profile.test]
# Reduce debug info to avoid rustc/LLVM DWARF stack overflows when compiling large integration tests.
debug = 1
